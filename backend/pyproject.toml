[project]
name = "mistral-ai-workspace-backend"
version = "1.0.0"
description = "FastAPI integration layer for Mistral OCR and Voxtral Speech-to-Text."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "mistralai>=2.9.1,<3.0.0",
  "pypdf>=5.0",
  "sqlalchemy>=2.0.36,<3.0",
  "asyncpg>=0.30.0,<1.0",
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1.0,<26.0",
  "PyJWT>=2.9.0,<3.0",
  "redis>=5.2.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "ruff>=0.7",
  "faiss-cpu>=1.10.0",
  "numpy>=2.0",
  "black>=24.10",
  "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
